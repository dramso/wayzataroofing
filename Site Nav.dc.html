<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="icon" type="image/avif" href="./assets/wayzata-roofing-logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
  <link href="https://db.onlinewebfonts.com/c/1cd1e7d71e048159076fd90b39846902?family=Open+Sauce+One" rel="stylesheet">
  <link href="https://db.onlinewebfonts.com/c/42acf9aa4a6dc2f2886a3f682e337ead?family=Open+Sauce+One+Bold" rel="stylesheet">
  <style>
    .sn-link { position:relative; color:rgba(255,255,255,.85); white-space:nowrap; }
    .sn-link:hover { color:#e8a020; }
    .sn-link::after { content:''; position:absolute; left:0; right:0; bottom:-7px; height:2px; border-radius:2px; background:#e8a020; transform:scaleX(0); transform-origin:left center; transition:transform .28s cubic-bezier(.4,0,.2,1); }
    .sn-link:hover::after { transform:scaleX(1); }
    .sn-link.sn-on { color:#e8a020; }
    .sn-cta { position:relative; display:inline-flex; align-items:center; justify-content:center; border:none; border-radius:360px; color:#ffffff; background:#e8a020; overflow:hidden; cursor:pointer; isolation:isolate; box-shadow:0 8px 22px -6px rgba(232,160,32,.6); transition:transform .2s ease, box-shadow .2s ease; }
    .sn-cta span { position:relative; z-index:1; }
    .sn-cta::after { content:''; position:absolute; inset:0; z-index:0; background:linear-gradient(115deg, transparent 20%, rgba(255,255,255,.78) 50%, transparent 80%); transform:translateX(-120%); animation:snShine 3.2s ease-in-out infinite; pointer-events:none; }
    .sn-cta:hover { transform:translateY(-2px); box-shadow:0 13px 30px -6px rgba(232,160,32,.72); }
    @keyframes snShine { 0% { transform:translateX(-120%); } 55%,100% { transform:translateX(120%); } }
    @media (prefers-reduced-motion: reduce) { .sn-cta::after { animation:none; } }
  </style>
</helmet>

<nav style="position:fixed;top:0;left:0;right:0;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:12px clamp(16px,3vw,28px) 26px;background:linear-gradient(180deg,#0f1f3a 0%,#0f1f3a 42%,rgba(15,31,58,.72) 72%,rgba(15,31,58,0) 100%);font-family:'Barlow',sans-serif">
  <a href="Homepage.dc.html" style="flex:0 0 auto;display:block">
    <img src="./assets/wayzata-roofing-logo-transparent.png" alt="Wayzata Roofing &amp; Exteriors" style="height:clamp(62px,9.8vw,95px);display:block">
  </a>
  <sc-if value="{{notMobile}}" hint-placeholder-val="{{ true }}">
  <div style="display:flex;align-items:center;gap:30px;font:600 12px/1 'Barlow',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85)">
    <a href="Homepage.dc.html" class="sn-link {{onHome}}" style-hover="color:#e8a020" style="cursor:pointer">Home</a>
    <div onMouseEnter="{{svcOpen}}" onMouseLeave="{{svcClose}}" style="position:relative;padding:10px 0;cursor:pointer">
      <a href="Services.dc.html" class="sn-link {{onServices}}" style-hover="color:#e8a020">Services ▾</a>
      <sc-if value="{{svcMenu}}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;top:100%;left:-18px;background:#0f1f3a;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 0;min-width:290px;box-shadow:0 18px 40px rgba(0,0,0,.4)">
          <sc-for list="{{svcLinks}}" as="s" hint-placeholder-count="10">
            <a href="{{s.href}}" style-hover="background:rgba(255,255,255,.07)" style="display:block;padding:11px 20px;letter-spacing:.1em;color:rgba(255,255,255,.9);cursor:pointer">{{s.t}}</a>
          </sc-for>
        </div>
      </sc-if>
    </div>
    <div onMouseEnter="{{areaOpen}}" onMouseLeave="{{areaClose}}" style="position:relative;padding:10px 0;cursor:pointer">
      <a href="Homepage.dc.html" class="sn-link {{onAreas}}" style-hover="color:#e8a020">Service Areas ▾</a>
      <sc-if value="{{areaMenu}}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;top:100%;left:-18px;background:#0f1f3a;border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:10px 0;min-width:250px;box-shadow:0 18px 40px rgba(0,0,0,.4)">
          <sc-for list="{{areaLinks}}" as="a" hint-placeholder-count="8">
            <a href="{{a.href}}" style-hover="background:rgba(255,255,255,.07)" style="display:block;padding:11px 20px;letter-spacing:.1em;color:rgba(255,255,255,.9);cursor:pointer">{{a.t}}</a>
          </sc-for>
        </div>
      </sc-if>
    </div>
    <a href="Why Choose Us.dc.html" class="sn-link {{onWhy}}" style-hover="color:#e8a020" style="cursor:pointer">Why Choose Us</a>
    <a href="About.dc.html" class="sn-link {{onAbout}}" style-hover="color:#e8a020" style="cursor:pointer">About</a>
    <a href="Contact.dc.html" class="sn-link {{onContact}}" style-hover="color:#e8a020" style="cursor:pointer">Contact</a>
  </div>
  <div style="display:flex;align-items:center;gap:20px;flex:0 0 auto">
    <a href="tel:9527776356" style="display:inline-flex;align-items:center;gap:8px;font:700 14px/1 'Barlow',sans-serif;color:#ffffff;letter-spacing:.02em;text-decoration:none"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg><span>952-777-6356</span></a>
    <a href="Contact.dc.html" class="sn-cta" style="font:700 13px/1.2 'Barlow',sans-serif;padding:12px 22px;text-decoration:none"><span>Get an Instant Quote</span></a>
  </div>
  </sc-if>
  <sc-if value="{{isMobile}}" hint-placeholder-val="{{ false }}">
    <span onClick="{{menuToggle}}" style="display:inline-flex;align-items:center;gap:9px;font:700 12px/1 'Barlow',sans-serif;letter-spacing:.2em;color:#fff;border:1px solid rgba(255,255,255,.4);padding:11px 16px;border-radius:99px;cursor:pointer"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="flex:0 0 auto"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg><span>{{menuLabel}}</span></span>
  </sc-if>
</nav>
<sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
  <div style="position:fixed;top:110px;left:0;right:0;z-index:59;background:#0f1f3a;border-bottom:1px solid rgba(255,255,255,.14);padding:16px clamp(16px,3vw,28px) 24px;display:flex;flex-direction:column;gap:4px;font-family:'Barlow',sans-serif">
    <a href="Homepage.dc.html" style="padding:13px 0;font:600 14px/1 'Barlow',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85);border-bottom:1px solid rgba(255,255,255,.08)">Home</a>
    <a href="Services.dc.html" style="padding:13px 0;font:600 14px/1 'Barlow',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85);border-bottom:1px solid rgba(255,255,255,.08)">Services</a>
    <a href="Our Work.dc.html" style="padding:13px 0;font:600 14px/1 'Barlow',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85);border-bottom:1px solid rgba(255,255,255,.08)">Our Work</a>
    <a href="wayzata.dc.html" style="padding:13px 0;font:600 14px/1 'Barlow',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85);border-bottom:1px solid rgba(255,255,255,.08)">Service Areas</a>
    <a href="Why Choose Us.dc.html" style="padding:13px 0;font:600 14px/1 'Barlow',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85);border-bottom:1px solid rgba(255,255,255,.08)">Why Choose Us</a>
    <a href="About.dc.html" style="padding:13px 0;font:600 14px/1 'Barlow',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85);border-bottom:1px solid rgba(255,255,255,.08)">About</a>
    
    <a href="Contact.dc.html" style="padding:13px 0 18px;font:600 14px/1 'Barlow',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.85)">Contact</a>
    <a href="Contact.dc.html" class="sn-cta" style="font:700 14px/1.2 'Barlow',sans-serif;padding:15px 24px;text-align:center;text-decoration:none"><span>Get an Instant Quote</span></a>
  </div>
</sc-if>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:110},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;services&quot;,&quot;work&quot;,&quot;process&quot;,&quot;about&quot;,&quot;journal&quot;,&quot;areas&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  SVC = [
    ['Residential Roofing', 'roofing'], ['Commercial Roofing', 'commercial-roofing'], ['Siding', 'siding'], ['Windows', 'windows'], ['Gutters', 'gutters'], ['Decks', 'decks']
  ];

  AREAS = [
    ['Wayzata', 'wayzata'], ['Lake Minnetonka', 'lake-minnetonka'], ['Minnetonka', 'minnetonka'],
    ['Plymouth', 'plymouth'], ['Maple Grove', 'maple-grove'], ['Medina', 'medina'],
    ['Hamel', 'hamel'], ['Chanhassen', 'chanhassen']
  ];

  state = { isMobile: false, menuOpen: false, svcMenu: false, areaMenu: false };

  componentDidMount() {
    this._r = () => {
      const m = window.innerWidth < 1120;
      if (m !== this.state.isMobile) this.setState({ isMobile: m });
    };
    window.addEventListener('resize', this._r);
    this._r();
  }
  componentWillUnmount() { window.removeEventListener('resize', this._r); }

  menuToggle = () => this.setState(s => ({ menuOpen: !s.menuOpen }));
  svcOpen = () => this.setState({ svcMenu: true });
  svcClose = () => this.setState({ svcMenu: false });
  areaOpen = () => this.setState({ areaMenu: true });
  areaClose = () => this.setState({ areaMenu: false });

  renderVals() {
    const cur = this.props.current || '';
    const on = (k) => (cur === k ? 'sn-on' : '');
    return {
      isMobile: this.state.isMobile,
      notMobile: !this.state.isMobile,
      menuOpen: this.state.menuOpen,
      menuLabel: this.state.menuOpen ? 'CLOSE' : 'MENU',
      svcMenu: this.state.svcMenu,
      svcLinks: this.SVC.map(([t, slug]) => ({ t, href: slug + '.dc.html' })),
      areaMenu: this.state.areaMenu,
      areaLinks: this.AREAS.map(([t, slug]) => ({ t, href: slug + '.dc.html' })),
      onAreas: cur === 'areas' ? 'sn-on' : '',
      areaOpen: this.areaOpen, areaClose: this.areaClose,
      onHome: on('home'), onWhy: on('why'), onServices: on('services'), onWork: on('work'),
      onProcess: on('process'), onAbout: on('about'), onJournal: on('journal'),
      onContact: on('contact'),
      menuToggle: this.menuToggle, svcOpen: this.svcOpen, svcClose: this.svcClose
    };
  }
}
</script>
</body>
</html>
